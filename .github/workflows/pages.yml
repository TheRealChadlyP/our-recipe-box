name: Publish recipe box to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir -p _site/assets
          cp index.html app.js styles.css sw.js manifest.webmanifest _site/
          cp assets/icon-192.png assets/icon-512.png _site/assets/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait until Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || echo 0)"
            if [ "$count" -gt 0 ]; then
              echo "GitHub Pages artifact is visible."
              sleep 12
              exit 0
            fi
            echo "Artifact not indexed yet (attempt $attempt of 12)."
            sleep 5
          done
          echo "::error::GitHub did not make the uploaded artifact available."
          exit 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
