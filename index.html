<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3ea" />
  <meta name="description" content="Our family's favorite recipes, all in one cozy place." />
  <link rel="icon" href="assets/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Our Recipe Box</title>
</head>
<body>
  <div id="app">
    <header class="site-header">
      <button class="brand" id="home-button" aria-label="Go to recipes">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-type">our recipe box<span class="brand-dot">.</span></span>
      </button>
      <div class="header-actions">
        <span class="sync-dot" id="sync-status" title="Stored on this device" aria-label="Stored on this device"></span>
        <button class="icon-btn" id="settings-button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.25v2.1m0 13.3v2.1M3.25 12h2.1m13.3 0h2.1M5.81 5.81l1.48 1.48m9.42 9.42 1.48 1.48m0-12.38-1.48 1.48M7.29 16.71l-1.48 1.48"/><circle cx="12" cy="12" r="4.2"/></svg></button>
      </div>
    </header>
    <main id="main" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-nav="home"><span aria-hidden="true">⌂</span> Recipes</button>
      <button class="nav-item" data-nav="favorites"><span aria-hidden="true">♡</span> Favorites</button>
      <button class="nav-item add-nav" data-nav="add"><span aria-hidden="true">＋</span> Add</button>
      <button class="nav-item" data-nav="settings"><span aria-hidden="true">⚙</span> Settings</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="app.js"></script>
</body>
</html>
