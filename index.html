<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9f1e5" />
  <meta name="description" content="A keepsake cookbook for all the recipes our family loves." />
  <link rel="icon" href="assets/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Our Recipe Box</title>
</head>
<body>
  <div id="app">
    <header class="site-header">
      <button class="brand" id="home-button" aria-label="Go to recipes">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 5v7a5 5 0 0 0 10 0V5M12 5v7M16 5v7M14 17v11"/><path d="M23 5c-3 4-4 7-4 11 0 2 3 2 4 0V5Zm0 12v11"/></svg></span>
        <span class="brand-type">our recipe box<span class="brand-dot">.</span></span>
      </button>
      <div class="header-actions">
        <span class="sync-dot" id="sync-status" title="Stored on this device" aria-label="Stored on this device"></span>
        <button class="icon-btn" id="settings-button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.25v2.1m0 13.3v2.1M3.25 12h2.1m13.3 0h2.1M5.81 5.81l1.48 1.48m9.42 9.42 1.48 1.48m0-12.38-1.48 1.48M7.29 16.71l-1.48 1.48"/><circle cx="12" cy="12" r="4.2"/></svg></button>
      </div>
    </header>
    <main id="main" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3V10Z"/><path d="M9 20v-7h6v7"/></svg> Recipes</button>
      <button class="nav-item" data-nav="favorites"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 5.9a5.1 5.1 0 0 0-7.2 0L12 7.4l-1.5-1.5a5.1 5.1 0 0 0-7.2 7.2L12 22l8.7-8.9a5.1 5.1 0 0 0 0-7.2Z"/></svg> Favorites</button>
      <button class="nav-item add-nav" data-nav="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg> Add</button>
      <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 14 4l2-.3 1 2 2.1.7v2.2l1.1 1.8-1.1 1.8v2.3l-2.1.7-1 2-2-.3-2 1.2-2-1.2-2 .3-1-2-2.1-.7v-2.3l-1.1-1.8 1.1-1.8V6.4L7 5.7l1-2 2 .3 2-1.2Z" transform="translate(0 2)"/><circle cx="12" cy="12" r="3"/></svg> Settings</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="app.js"></script>
</body>
</html>
